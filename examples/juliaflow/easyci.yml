# EasyCI settings for JuliaFlow (Gravelaw/LowcodeMLtoolkit.jl), kept outside the JuliaFlow repository.
#
# EasyCI runs JuliaFlow's own GitHub Actions jobs natively: it reads their steps from
# .github/workflows/ci.yml and release-candidate.yml and runs them itself in the WSL distro. JuliaFlow
# no longer needs a runner of its own (Gravelaw/LowcodeMLtoolkit.jl#67). The earlier configuration
# that delegated every job to JuliaFlow's scripts/ci/wsl.mjs is kept in
# legacy/juliaflow/easyci.delegated.yml for reference only.
#
# Use it with:
#   easyci run --repo "D:\Julia Project" --profile pr --config examples\juliaflow\easyci.yml
#   easyci run --repo "D:\Julia Project" --profile release-candidate --config examples\juliaflow\easyci.yml
#   easyci promote <run-id> --artifact debian-release-verification --to D:\Releases\JuliaFlow
#
# Caches: the Julia depot, npm cache and Playwright browsers stay in the distro between runs (the
# warm path). The -cold profiles give each job empty ones instead, for evidence that must not depend
# on earlier runs.
#
# The variables below give each job what JuliaFlow's tests read: a private PostgreSQL and the
# JULIAFLOW_* settings.
version: 1
backend: wsl:juliaflow-ci-ubuntu24
report: true
profiles:
  pr:                     {event: pull_request, jobs: [web, julia, debian-release-gate]}
  pr-cold:                {event: pull_request, jobs: [web, julia, debian-release-gate]}
  push:                   {event: push, jobs: [web, julia]}
  push-cold:              {event: push, jobs: [web, julia]}
  release-candidate:      {event: workflow_dispatch, workflow: release-candidate.yml, jobs: [debian-release-gate]}
  release-candidate-cold: {event: workflow_dispatch, workflow: release-candidate.yml, jobs: [debian-release-gate]}
jobs:
  execution-policy:
    skip: true                          # hosted-only gate; EasyCI decides locally
  web:
    when: always                        # ignore the workflow `if:` (it waits for execution-policy)
    timeout_minutes: 120
    stall_minutes: 30
    services: {postgres: {version: 16}}
    env: &juliaflow-env
      JULIAFLOW_CI_EXTERNAL_POSTGRES: "1"
      JULIAFLOW_DATABASE_URL: ${{ env.DATABASE_URL }}
      JULIAFLOW_TEST_POSTGRES_URL: ${{ env.DATABASE_URL }}
      JULIAFLOW_TEST_POSTGRES_SCHEMA: juliaflow_ci_easyci
      JULIAFLOW_CONTROL_DOC_BASE: ${{ github.event.pull_request.base.sha }}
      JULIAFLOW_JULIA_CMD: julia
      JULIAFLOW_CI_HEAP_HINT: 1500M
      JULIA_NUM_PRECOMPILE_TASKS: "1"
    # -cold profiles: empty caches for this job only, removed afterwards.
    setup: &cold-caches |
      prep="/var/tmp/easyci-$EASYCI_RUN_ID-$EASYCI_JOB"
      mkdir -p "$prep"
      case "$EASYCI_PROFILE" in *-cold)
        mkdir -p "$prep/cold/julia" "$prep/cold/npm" "$prep/cold/playwright"
        # The trailing colon keeps Julia's bundled depots after the empty one.
        echo "JULIA_DEPOT_PATH=$prep/cold/julia:" >> "$GITHUB_ENV"
        echo "npm_config_cache=$prep/cold/npm" >> "$GITHUB_ENV"
        echo "PLAYWRIGHT_BROWSERS_PATH=$prep/cold/playwright" >> "$GITHUB_ENV"
        echo "cold caches in $prep/cold";;
      *) echo "warm caches (the distro's own)";;
      esac
    cleanup: &release |
      prep="/var/tmp/easyci-$EASYCI_RUN_ID-$EASYCI_JOB"
      if [ -f "$prep/swap" ]; then swapoff "$prep/swap" 2>/dev/null || true; fi
      rm -rf "$prep"
  julia:
    when: always
    timeout_minutes: 240
    stall_minutes: 45                   # Pkg.instantiate and precompile are quiet
    services: {postgres: {version: 16}}
    env: *juliaflow-env
    # The distro's VM has 4 GiB. Julia gets a 1500M heap-size hint and a temporary 3 GiB swap file
    # for this job (what JuliaFlow's own runner used to give it); without them the kernel kills the
    # test process (exit 137). cleanup releases the swap file.
    setup: &julia-memory |
      prep="/var/tmp/easyci-$EASYCI_RUN_ID-$EASYCI_JOB"
      mkdir -p "$prep/bin"
      case "$EASYCI_PROFILE" in *-cold)
        mkdir -p "$prep/cold/julia" "$prep/cold/npm" "$prep/cold/playwright"
        echo "JULIA_DEPOT_PATH=$prep/cold/julia:" >> "$GITHUB_ENV"
        echo "npm_config_cache=$prep/cold/npm" >> "$GITHUB_ENV"
        echo "PLAYWRIGHT_BROWSERS_PATH=$prep/cold/playwright" >> "$GITHUB_ENV"
        echo "cold caches in $prep/cold";;
      esac
      printf '#!/bin/sh\nexec %s --heap-size-hint=1500M "$@"\n' "$(command -v julia)" > "$prep/bin/julia"
      chmod 755 "$prep/bin/julia"
      echo "$prep/bin" >> "$GITHUB_PATH"
      fallocate -l 3G "$prep/swap"
      chmod 600 "$prep/swap"
      mkswap "$prep/swap" > /dev/null
      swapon "$prep/swap"
      echo "julia wrapper with --heap-size-hint=1500M; 3 GiB swap at $prep/swap"
    cleanup: *release
  debian-release-gate:
    when: always
    timeout_minutes: 180
    stall_minutes: 45
    services: {postgres: {version: 16}}
    env: *juliaflow-env
    setup: *julia-memory
    cleanup: *release
