[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "easyci"
version = "0.1.0"
description = "Local-first CI: run your GitHub Actions workflows on your own Windows PC and report back to GitHub"
requires-python = ">=3.11"
dependencies = ["PyYAML>=6"]

[project.scripts]
easyci = "easyci.cli:main"

[tool.setuptools]
packages = ["easyci", "easyci.backends"]
